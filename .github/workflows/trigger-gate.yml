name: trigger-overlap gate

# Blocks query-set and skill-content edits from silently reintroducing
# cross-skill coin-flips (a true query hitting >=2 of another skill's trigger
# terms) or self-check violations, and enforces the static SKILL.md quality
# floor. Runs only when the relevant files change; use workflow_dispatch to
# force a run.

on:
  push:
    paths:
      - 'standalone-evals/**'
      - 'package_skills.py'
      - '*/SKILL.md'
      - 'shared/**'
      - '.github/workflows/trigger-gate.yml'
  pull_request:
    paths:
      - 'standalone-evals/**'
      - 'package_skills.py'
      - '*/SKILL.md'
      - 'shared/**'
      - '.github/workflows/trigger-gate.yml'
  workflow_dispatch:

jobs:
  hygiene-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The checks are stdlib-only (json/re/pathlib/subprocess), so no pip
      # install is needed. The gate runs the repo's self-contained current
      # harness: standalone benchmark contract, per-skill contract checks,
      # example syntax smoke, one-skill package isolation, and the vendored
      # static SKILL.md audit (quality floor). Any check that exits non-zero
      # fails the job and blocks merge.
      - name: Run CI gate (standalone contracts + isolation + static audit)
        run: sh standalone-evals/run_current_ci.sh
